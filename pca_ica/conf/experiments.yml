# Experiment grid for the dimensionality-reduction benchmark.
#
# The notebook overrides catalog / schema / table_prefix from job parameters
# (so the same grid can target any environment). Everything below is the sweep.
#
# Grid size = datasets × [none + reducers×n_components] × clustering × models.
# With the defaults: 2 × (1 + 3×1) × 2 × 6 = 96 runs. Add n_components values or
# models to widen it; trim datasets/clustering to shrink it.

task: classification

datasets:
  - campus_placement
  - engineering_salary

reducers:
  - none
  - pca
  - ica
  - random_projection

n_components:
  - 10

clustering:
  - none
  - kmeans

models:
  - logistic_regression
  - svm_rbf
  - knn
  - random_forest
  - xgboost
  - mlp

cv_folds: 5
test_size: 0.2
random_state: 42
register_best: false
