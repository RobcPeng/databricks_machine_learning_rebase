task: classification

# Datasets to benchmark (registered in src/dr_bench/datasets.py).
# pisa_2022 downloads a ~600 MB SPSS file and requires pyreadstat; remove it
# from this list to skip that cost.
datasets:
  - nscg_2023
  - scorecard_2026
  - acs_co_2024
  - pisa_2022

reducers:
  - none
  - pca
  - ica
  - random_projection

n_components:
  - 10

clustering:
  - none
  - kmeans

models:
  - logistic_regression
  - svm_rbf
  - knn
  - random_forest
  - xgboost
  - mlp

cv_folds: 5
test_size: 0.2
random_state: 42
sample_rows: 6000
register_best: false
