bundle:
  name: dr_bench

include:
  - resources/*.yml

variables:
  catalog:
    description: UC catalog for the medallion schemas.
    default: rpeng_upleveling
  schema_prefix:
    description: Base name for the medallion schemas (_00_landing, _01_cleansed, _02_curated).
    default: dimensionality_reduction

targets:
  sled:
    default: true
    mode: development
    workspace:
      profile: SLED_fe_demo
