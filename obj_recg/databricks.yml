# uplevels_cv — Databricks Asset Bundle
#
# A benchmark harness for comparing computer-vision model families on a sports
# object-detection + pose-estimation task: locate the athlete/equipment (boxes)
# and trace the limb lines of a golf swing (keypoints -> skeleton edges).
#
# Model families compared (see src/uplevels_cv/config.py):
#   - yolo   : Ultralytics YOLO11 (one-stage; detect + pose)
#   - resnet : torchvision R-CNN with a ResNet-50 FPN backbone (two-stage;
#              Faster R-CNN for detection, Keypoint R-CNN for limb keypoints)
#   - cnn    : lightweight CNN baseline (SSDlite / RetinaNet)
#
# Training runs on serverless GPU compute (AI Runtime). See README.md.

bundle:
  name: uplevels_cv

variables:
  catalog:
    description: Unity Catalog holding the schema, volume, and registered models.
    default: rpeng_upleveling
  project:
    description: >-
      Project name. Each medallion layer gets its own schema named
      <project>_<numbered_layer> (e.g. seeing_models_03_gold), so the project's
      schemas group together, sort in medallion order, and table names stay bare.
    default: seeing_models
  volume:
    description: Managed volume for images, labels, and run artifacts.
    default: cv_data
  experiment_root:
    description: Workspace folder for the MLflow experiments (must be writable).
    default: /Users/rob.peng@databricks.com/uplevels_cv
  serverless_env_version:
    description: Serverless environment version (v5 = Runtime 17.3, GPU-capable).
    default: "5"
  gpu_type:
    description: Serverless GPU accelerator requested via the @distributed API.
    default: A10

include:
  - resources/*.yml

# Ship the fixtures (skeleton spec, tiny sample annotations) with the bundle.
# Data/JSON files are excluded from sync by default; this opts them back in.
sync:
  include:
    - fixtures/**

targets:
  # Personal iteration target (default). Isolated from prod by its own project
  # namespace: dev writes to seeing_models_dev_* schemas and its own MLflow
  # experiment; prod writes to seeing_models_*. Both targets share var.catalog,
  # so without a distinct project a default `databricks bundle deploy` (dev)
  # would overwrite prod's tables, volume, and registered-model @prod aliases.
  # No `mode: development`: its forced dev_<user>_ name prefix isn't wanted; the
  # dev-mode behaviors that are wanted are set explicitly under presets.
  dev:
    default: true
    variables:
      project: seeing_models_dev
      experiment_root: /Users/rob.peng@databricks.com/uplevels_cv_dev
    presets:
      name_prefix: ""
      pipelines_development: true
      trigger_pause_status: PAUSED
    workspace:
      host: https://adb-3438839487639471.11.azuredatabricks.net
      root_path: /Workspace/Users/rob.peng@databricks.com/.bundle/${bundle.name}/${bundle.target}

  # Shared/scheduled target. Deploy with: databricks bundle deploy -t prod -p SLED_fe_demo
  prod:
    mode: production
    workspace:
      host: https://adb-3438839487639471.11.azuredatabricks.net
      root_path: /Workspace/Users/rob.peng@databricks.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: rob.peng@databricks.com
