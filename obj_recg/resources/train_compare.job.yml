# Multi-task benchmark job:
#
#   setup_data ─┬─> train_yolo   ─┐
#               ├─> train_resnet ─┼─> compare
#               └─> train_cnn    ─┘
#
# All tasks run as serverless notebook tasks (env v5). The actual GPU training
# happens inside each notebook via the serverless-GPU @distributed API, so no
# cluster is defined here. To force a specific accelerator, change var.gpu_type
# (A10 | H100). A classic-GPU-cluster fallback is shown commented at the bottom.
resources:
  jobs:
    train_and_compare:
      name: "[${bundle.target}] uplevels_cv — train & compare vision models"
      tags:
        project: uplevels_cv
        domain: sports-cv

      # Run per sport: golf | football | basketball | baseball | hockey | tennis.
      # Override at launch: databricks bundle run train_and_compare --params sport=basketball
      # Tables carry a `sport` column, so runs accumulate across sports.
      parameters:
        - name: sport
          default: golf

      # Shared serverless environment for every task. torch/torchvision are
      # provided by the AI Runtime GPU environment on the @distributed workers,
      # so they are intentionally NOT pinned here (avoids a CPU-torch clash).
      environments:
        # YOLO, RT-DETR, and the torchvision families all run here.
        - environment_key: cv_env
          spec:
            client: "${var.serverless_env_version}"
            dependencies:
              - ultralytics>=8.3
              - pycocotools>=2.0.7
              - opencv-python-headless>=4.10
              - mlflow>=3.1.0
        # RTMPose (OpenMMLab). mmcv must match the runtime's torch+CUDA. If wheel
        # resolution fails here, install via OpenMIM in the notebook instead (the
        # 06 notebook has the `mim install` cell).
        - environment_key: mmpose_env
          spec:
            client: "${var.serverless_env_version}"
            dependencies:
              - openmim>=0.3
              - mmengine>=0.10
              - mmcv>=2.1
              - mmdet>=3.3
              - mmpose>=1.3
              - pycocotools>=2.0.7
              - mlflow>=3.1.0
        # MediaPipe BlazePose (CPU inference-only).
        - environment_key: mediapipe_env
          spec:
            client: "${var.serverless_env_version}"
            dependencies:
              - mediapipe>=0.10
              - pycocotools>=2.0.7
              - mlflow>=3.1.0
        # Team-performance tabular models.
        - environment_key: teamperf_env
          spec:
            client: "${var.serverless_env_version}"
            dependencies:
              - xgboost>=2.1
              - scikit-learn>=1.5
              - mlflow>=3.1.0

      tasks:
        - task_key: setup_data
          notebook_task:
            notebook_path: ../notebooks/00_setup_data.py
            base_parameters:
              catalog: ${var.catalog}
              project: ${var.project}
              volume: ${var.volume}
              sport: "{{job.parameters.sport}}"
          environment_key: cv_env

        # Build bronze/silver/gold from the staged data before training reads it.
        - task_key: run_medallion
          depends_on:
            - task_key: setup_data
          pipeline_task:
            pipeline_id: ${resources.pipelines.medallion.id}

        - task_key: train_yolo
          depends_on:
            - task_key: run_medallion
          notebook_task:
            notebook_path: ../notebooks/01_train_yolo.py
            base_parameters:
              model_family: yolo
              catalog: ${var.catalog}
              project: ${var.project}
              volume: ${var.volume}
              sport: "{{job.parameters.sport}}"
              experiment_root: ${var.experiment_root}
              gpu_type: ${var.gpu_type}
          environment_key: cv_env

        - task_key: train_resnet
          depends_on:
            - task_key: run_medallion
          notebook_task:
            notebook_path: ../notebooks/02_train_resnet.py
            base_parameters:
              model_family: resnet
              catalog: ${var.catalog}
              project: ${var.project}
              volume: ${var.volume}
              sport: "{{job.parameters.sport}}"
              experiment_root: ${var.experiment_root}
              gpu_type: ${var.gpu_type}
          environment_key: cv_env

        - task_key: train_cnn
          depends_on:
            - task_key: run_medallion
          notebook_task:
            notebook_path: ../notebooks/03_train_cnn_baseline.py
            base_parameters:
              model_family: cnn
              catalog: ${var.catalog}
              project: ${var.project}
              volume: ${var.volume}
              sport: "{{job.parameters.sport}}"
              experiment_root: ${var.experiment_root}
              gpu_type: ${var.gpu_type}
          environment_key: cv_env

        - task_key: train_rtdetr
          depends_on:
            - task_key: run_medallion
          notebook_task:
            notebook_path: ../notebooks/05_train_rtdetr.py
            base_parameters:
              model_family: detr
              catalog: ${var.catalog}
              project: ${var.project}
              volume: ${var.volume}
              sport: "{{job.parameters.sport}}"
              experiment_root: ${var.experiment_root}
              gpu_type: ${var.gpu_type}
          environment_key: cv_env

        - task_key: train_rtmpose
          depends_on:
            - task_key: run_medallion
          notebook_task:
            notebook_path: ../notebooks/06_train_rtmpose.py
            base_parameters:
              model_family: mmpose
              catalog: ${var.catalog}
              project: ${var.project}
              volume: ${var.volume}
              sport: "{{job.parameters.sport}}"
              experiment_root: ${var.experiment_root}
              gpu_type: ${var.gpu_type}
          environment_key: mmpose_env

        - task_key: eval_mediapipe
          depends_on:
            - task_key: run_medallion
          notebook_task:
            notebook_path: ../notebooks/07_eval_mediapipe.py
            base_parameters:
              model_family: mediapipe
              catalog: ${var.catalog}
              project: ${var.project}
              volume: ${var.volume}
              sport: "{{job.parameters.sport}}"
              experiment_root: ${var.experiment_root}
          environment_key: mediapipe_env

        - task_key: train_team_performance
          depends_on:
            - task_key: run_medallion
          notebook_task:
            notebook_path: ../notebooks/08_train_team_performance.py
            base_parameters:
              catalog: ${var.catalog}
              project: ${var.project}
              volume: ${var.volume}
              experiment_root: ${var.experiment_root}
              sport: "{{job.parameters.sport}}"
          environment_key: teamperf_env

        - task_key: compare
          depends_on:
            - task_key: train_yolo
            - task_key: train_resnet
            - task_key: train_cnn
            - task_key: train_rtdetr
            - task_key: train_rtmpose
            - task_key: eval_mediapipe
          notebook_task:
            notebook_path: ../notebooks/04_compare_models.py
            base_parameters:
              catalog: ${var.catalog}
              project: ${var.project}
              volume: ${var.volume}
              sport: "{{job.parameters.sport}}"
              experiment_root: ${var.experiment_root}
          environment_key: cv_env

      queue:
        enabled: true

# ---------------------------------------------------------------------------
# CLASSIC GPU CLUSTER FALLBACK (Azure)
# ---------------------------------------------------------------------------
# If serverless GPU / @distributed is not enabled on the workspace, delete the
# `environment_key: cv_env` line from each training task and attach a job
# cluster instead. Azure GPU node types (verify availability in your region):
#   Standard_NC4as_T4_v3   -> 1x T4    (cheapest)
#   Standard_NC24ads_A100_v4 -> 1x A100 (fast)
#
#   job_clusters:
#     - job_cluster_key: gpu
#       new_cluster:
#         spark_version: 17.3.x-gpu-ml-scala2.13   # verify current GPU ML runtime
#         node_type_id: Standard_NC4as_T4_v3
#         num_workers: 0                            # single-node
#         data_security_mode: SINGLE_USER
#   # then on each training task: `job_cluster_key: gpu` instead of environment_key
