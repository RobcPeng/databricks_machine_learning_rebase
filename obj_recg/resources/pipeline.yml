# Medallion data pipeline (Lakeflow Declarative Pipeline, serverless).
# landing (raw ingest) -> bronze (structured) -> silver (validated) -> gold
# (aggregated). Each layer publishes to its own schema via fully-qualified
# dataset names, so the `schema` below is only the default. Source lives in
# ../transformations; config is read in the code via spark.conf.get(...).
resources:
  pipelines:
    medallion:
      name: "[${bundle.target}] uplevels_cv medallion"
      catalog: ${var.catalog}
      schema: ${resources.schemas.gold.name}  # default only; datasets are fully-qualified
      serverless: true
      photon: true
      libraries:
        - glob:
            include: ../transformations/**
      configuration:
        catalog: ${var.catalog}
        project: ${var.project}
        volume_root: /Volumes/${var.catalog}/${resources.schemas.landing.name}/${var.volume}
