# Managed volume for images, COCO-format label files, game CSVs, and per-run
# artifacts. It lives in the landing schema (raw data lands here). Referencing
# ${resources.schemas.landing.name} makes DABs create the schema before the volume.
resources:
  volumes:
    cv_data:
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.landing.name}
      name: ${var.volume}
      volume_type: MANAGED
      comment: >-
        Frames, COCO keypoint/bbox annotations, game CSVs, and training artifacts.
        Layout under /Volumes/<cat>/00_landing_<project>/<vol>/:
        raw/ images/ labels/ games/ splits/ artifacts/ predictions/, namespaced by sport.
