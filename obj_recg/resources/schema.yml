# One Unity Catalog schema per medallion layer, named <project>_<numbered_layer>
# so all the project's schemas group together and sort landing -> bronze ->
# silver -> gold. The catalog (var.catalog) must already exist; DABs manage the
# schemas and below.
resources:
  schemas:
    landing:
      catalog_name: ${var.catalog}
      name: ${var.project}_00_landing
      comment: "uplevels_cv landing layer: raw file ingest (labels, frames, games)."
    bronze:
      catalog_name: ${var.catalog}
      name: ${var.project}_01_bronze
      comment: "uplevels_cv bronze layer: structured records (images, keypoints, games)."
    silver:
      catalog_name: ${var.catalog}
      name: ${var.project}_02_silver
      comment: "uplevels_cv silver layer: validated records."
    gold:
      catalog_name: ${var.catalog}
      name: ${var.project}_03_gold
      comment: "uplevels_cv gold layer: features, leaderboards, registered models."
