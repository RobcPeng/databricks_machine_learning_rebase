[project]
name = "uplevels-cv"
version = "0.1.0"
description = "Benchmark harness comparing YOLO / ResNet R-CNN / CNN model families on sports object-detection + pose estimation (golf-swing limb lines)."
requires-python = ">=3.12,<3.13"  # match serverless env v5 (Python 3.12.3)
dependencies = [
    "mlflow>=3.1.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyyaml>=6.0",
]

# Heavy, platform-specific training libs. Installed on the serverless GPU runtime
# at job time (see resources/train_compare.job.yml and the notebooks); pulled
# locally only when you want to run training on your own machine.
[project.optional-dependencies]
# Ultralytics (YOLO11 + RT-DETR) and torchvision (R-CNN, SSDlite).
train = [
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.3",       # YOLO11 + RT-DETR
    "pycocotools>=2.0.7",     # COCO mAP / OKS evaluation
    "opencv-python-headless>=4.10",
]
# RTMPose. mmcv must match torch+CUDA; install via OpenMIM (see 06 notebook).
mmpose = [
    "openmim>=0.3",
    "mmengine>=0.10",
    "mmcv>=2.1",
    "mmdet>=3.3",
    "mmpose>=1.3",
]
# MediaPipe BlazePose (CPU, inference-only).
mediapipe = [
    "mediapipe>=0.10",
]
dev = [
    "pytest>=8.0",
    "databricks-connect==18.0.*",  # matches serverless env v5; do NOT also install pyspark
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uplevels_cv"]

[tool.ruff]
line-length = 100
target-version = "py312"
